<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم | زفاف عبدالرحمن & مايا</title>
  <link href="[https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap](https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap)" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>
<body>

  <!-- Login Overlay -->
  <div class="admin-login-overlay" id="loginOverlay">
    <div class="login-card">
      <h2>دخول لوحة التحكم</h2>
      <p>أدخل كلمة المرور للمتابعة</p>
      <form id="adminLoginForm">
        <input type="password" id="adminPass" placeholder="كلمة المرور" required>
        <button type="submit" class="btn-primary">دخول</button>
      </form>
    </div>
  </div>

  <!-- Admin Main Dashboard -->
  <div class="admin-wrapper" id="adminWrapper">
    <aside class="sidebar">
      <div class="sidebar-brand">A & M Admin</div>
      <nav class="sidebar-nav">
        <a href="#stats" class="active">الإحصائيات</a>
        <a href="#rsvps">قائمة الحضور</a>
        <a href="#guestbook">دفتر التهاني</a>
      </nav>
      <button class="btn-logout" id="btnLogout">تسجيل الخروج</button>
    </aside>

    <main class="admin-content">
      <header class="topbar">
        <h1>لوحة متابعة الزفاف</h1>
        <button class="btn-export" id="btnExportCSV">📥 تصدير الحضور (CSV)</button>
      </header>

      <!-- Stats Grid -->
      <section class="stats-grid" id="stats">
        <div class="stat-card">
          <h3>إجمالي الزوار</h3>
          <span class="stat-number" id="statVisitors">0</span>
        </div>
        <div class="stat-card">
          <h3>تأكيدات الحضور</h3>
          <span class="stat-number" id="statAttending">0</span>
        </div>
        <div class="stat-card">
          <h3>المعتذرون</h3>
          <span class="stat-number" id="statDeclined">0</span>
        </div>
        <div class="stat-card">
          <h3>إجمالي الرسائل</h3>
          <span class="stat-number" id="statMessages">0</span>
        </div>
      </section>

      <!-- RSVPs Table Section -->
      <section class="table-section" id="rsvps">
        <h2>قائمة التأكيدات (RSVP)</h2>
        <div class="table-responsive">
          <table class="data-table">
            <thead>
              <tr>
                <th>الاسم</th>
                <th>الهاتف</th>
                <th>المرافقون</th>
                <th>الحالة</th>
                <th>الرسالة</th>
                <th>الإجراءات</th>
              </tr>
            </thead>
            <tbody id="rsvpTableBody">
              <!-- Dynamically Populated -->
            </tbody>
          </table>
        </div>
      </section>

      <!-- Guestbook Section -->
      <section class="table-section" id="guestbook">
        <h2>إدارة التهاني</h2>
        <div class="table-responsive">
          <table class="data-table">
            <thead>
              <tr>
                <th>الاسم</th>
                <th>الرسالة</th>
                <th>الإجراءات</th>
              </tr>
            </thead>
            <tbody id="guestbookTableBody">
              <!-- Dynamically Populated -->
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="admin.js"></script>
</body>
</html>
